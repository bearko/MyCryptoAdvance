<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<meta name="theme-color" content="#12200f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MyCryptoAdvance RPG — フィールド</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2256%22>🗺</text></svg>" />
<link rel="stylesheet" href="css/rpg.css" />
</head>
<body>

<div id="app" class="app">
  <canvas id="field" class="field"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="hud__item"><span class="hud__coin"></span><span id="coinValue">0</span></div>
    <div class="hud__item"><span class="hud__label">宝箱</span><span id="chestValue">0/0</span></div>
  </div>

  <!-- 調べられるときだけ出る -->
  <div id="prompt" class="prompt"><b>A</b> しらべる</div>

  <!-- 仮想スティック（左側をどこでも触ると出る） -->
  <div id="stick" class="stick"><div id="stickKnob" class="stick__knob"></div></div>

  <!-- ボタン -->
  <div class="pad">
    <button class="pad-btn pad-btn--b" data-button="attack" type="button">B</button>
    <button class="pad-btn pad-btn--a" data-button="action" type="button">A</button>
  </div>

  <div id="hint" class="hint">左側ドラッグで移動　<b>A</b>しらべる　<b>B</b>攻撃</div>

  <!-- ローディング＆タイトル -->
  <div id="loading" class="overlay">
    <div class="overlay__title">MyCryptoAdvance RPG</div>
    <div class="overlay__sub">FIELD PROTOTYPE</div>
    <div id="loadingText" class="overlay__text">読み込み中…</div>
    <div class="bar"><div id="loadingBar" class="bar__fill"></div></div>
  </div>

  <div id="title" class="overlay hidden">
    <div class="overlay__title">MyCryptoAdvance RPG</div>
    <div class="overlay__sub">FIELD PROTOTYPE</div>
    <p class="overlay__desc">
      MCHウォーリアーでフィールドを歩き、<br>宝箱を探そう。
    </p>
    <button id="startBtn" class="start-btn" type="button">TAP TO START</button>
    <p class="overlay__credit">
      Hero animation: mycryptoheroes / Data・Image/HeroAnimations<br>
      Character template: Eris Esra's Character Templates Pack
    </p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
