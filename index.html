<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<meta name="theme-color" content="#12200f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MyCryptoAdvance RPG — フィールド</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2256%22>🗺</text></svg>" />
<link rel="stylesheet" href="css/rpg.css" />
</head>
<body>

<div id="app" class="app">

  <!-- 上50%: ゲーム画面 -->
  <section id="fieldPane" class="pane pane--field">
    <canvas id="field" class="field"></canvas>

    <div class="zoom">
      <button class="zoom__btn" id="zoomOut" type="button" aria-label="縮小">−</button>
      <span class="zoom__label" id="zoomLabel">×2</span>
      <button class="zoom__btn" id="zoomIn" type="button" aria-label="拡大">＋</button>
    </div>

    <div id="prompt" class="prompt"><b>A</b> しらべる</div>
  </section>

  <!-- 中20%: マップ画面 -->
  <section id="mapPane" class="pane pane--map">
    <div class="gauge gauge--left">
      <span class="gauge__coin"></span><span id="coinValue">0</span>
    </div>

    <canvas id="minimap" class="minimap"></canvas>

    <div class="gauge gauge--right">
      <span class="gauge__label">宝箱</span><span id="chestValue">0/0</span>
    </div>

    <div class="map-name">はじまりの草原</div>
  </section>

  <!-- 下30%: スティック画面 -->
  <section id="padPane" class="pane pane--pad">
    <div class="pad-hint">このエリアをドラッグで移動</div>

    <div id="stick" class="stick">
      <div class="stick__ring"></div>
      <div id="stickKnob" class="stick__knob"></div>
    </div>

    <div class="pad">
      <button class="pad-btn pad-btn--b" data-button="attack" type="button">B<small>攻撃</small></button>
      <button class="pad-btn pad-btn--a" data-button="action" type="button">A<small>しらべる</small></button>
    </div>
  </section>

  <!-- ローディング＆タイトル -->
  <div id="loading" class="overlay">
    <div class="overlay__title">MyCryptoAdvance RPG</div>
    <div class="overlay__sub">FIELD PROTOTYPE</div>
    <div id="loadingText" class="overlay__text">読み込み中…</div>
    <div class="bar"><div id="loadingBar" class="bar__fill"></div></div>
  </div>

  <div id="title" class="overlay hidden">
    <div class="overlay__title">MyCryptoAdvance RPG</div>
    <div class="overlay__sub">FIELD PROTOTYPE</div>
    <p class="overlay__desc">
      MCHウォーリアーでフィールドを歩き、<br>宝箱を探そう。
    </p>
    <button id="startBtn" class="start-btn" type="button">TAP TO START</button>
    <p class="overlay__credit">
      Hero animation: mycryptoheroes / Data・Image/HeroAnimations<br>
      Character template: Eris Esra's Character Templates Pack
    </p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
