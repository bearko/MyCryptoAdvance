<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0c0a14" />
<title>MyCryptoAdvance — 時空英雄譚</title>
<meta property="og:title" content="MyCryptoAdvance — 時空英雄譚" />
<meta property="og:description" content="クリプトワールドで歴史の英雄と共に戦え" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2256%22>⚔</text></svg>" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/game.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="splash" class="splash">
  <div class="splash__logo">MyCryptoAdvance</div>
  <div class="splash__sub">時空英雄譚</div>
  <div class="splash__loading">読み込み中…</div>
  <div class="splash__progress"><div class="splash__bar"></div></div>
</div>

<section id="titleScreen" class="title-screen hidden">
  <h1 class="title-screen__title">MyCryptoAdvance</h1>
  <p class="title-screen__sub">時空英雄譚</p>
  <p class="title-screen__desc">クリプトワールドで<br>歴史の英雄と共に侵略者を打ち倒せ</p>
  <button id="btnPressStart" class="title-screen__press">TAP TO START</button>
</section>

<main id="gameContainer" class="game-container hidden">
  <!-- Scene Layer (prologue) -->
  <div id="sceneLayer" class="scene-layer">
    <canvas id="sceneCanvas" class="scene-canvas"></canvas>
    <div id="characterLayer" class="character-layer"></div>
    <div id="effectLayer" class="effect-layer"></div>
  </div>

  <!-- Game Canvas (survival battle) -->
  <canvas id="gameCanvas" class="game-canvas hidden"></canvas>

  <!-- Battle HUD -->
  <div id="battleHud" class="battle-hud hidden">
    <div class="hud-top">
      <div class="hud-hp">
        <div class="hud-hp__bar"><div class="hud-hp__fill" id="hudHpFill"></div></div>
        <span class="hud-hp__text" id="hudHpText">200 / 200</span>
      </div>
      <div class="hud-xp">
        <span class="hud-xp__lv" id="hudLevel">Lv.1</span>
        <div class="hud-xp__bar"><div class="hud-xp__fill" id="hudXpFill"></div></div>
      </div>
    </div>
    <div class="hud-center">
      <span class="hud-timer" id="hudTimer">0:00</span>
    </div>
    <div class="hud-stats">
      <span class="hud-remaining" id="hudRemaining">仲間 0/4</span>
      <span class="hud-kills" id="hudKills">0 KILLS</span>
      <span class="hud-allies" id="hudAllies">×1</span>
    </div>
    <div class="hud-controls">
      <button class="hud-btn-tactic" id="btnTactic">バランスよく</button>
      <button class="hud-btn-pause" id="btnPause">⏸</button>
    </div>
  </div>

  <!-- Level Up Overlay -->
  <div id="levelUpOverlay" class="levelup-overlay hidden"></div>

  <!-- Dialogue Layer -->
  <div id="dialogueLayer" class="dialogue-layer hidden">
    <div class="dialogue-box">
      <img id="dialoguePortrait" class="dialogue-portrait hidden" src="" alt="" draggable="false">
      <div class="dialogue-content">
        <div class="dialogue-speaker" id="dialogueSpeaker"></div>
        <div class="dialogue-text" id="dialogueText"></div>
      </div>
      <div class="dialogue-indicator" id="dialogueIndicator">▼</div>
    </div>
  </div>

  <!-- Transition Overlay -->
  <div id="transitionOverlay" class="transition-overlay hidden"></div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
